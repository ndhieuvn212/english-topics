<style>
/* Layout: 1920×1080 cisbox slide canvas scaled to fit; paper slides, dark green only on cover/dividers/closing. Single committed look. */
:root{
  --brand:#215B33; --emphasis:#2E8C3C; --subtle:#E8F7E8; --sage-border:#C1E3C4;
  --paper:#F5FBF5; --card:#FFFFFF; --text:#202020; --text-2:#646464; --text-3:#838383;
  --border:#D9D9D9; --grid:#F0F0F0; --dark:#0D4B24; --page:#DCE5DE;
  --f-en:"PT Sans","Segoe UI",Calibri,sans-serif;
  --f-vi:"Noto Sans","Segoe UI",Arial,sans-serif;
  --f-ipa:"Noto Sans","Doulos SIL","Charis SIL","Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--page);color:var(--text);font-family:var(--f-vi);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:12px;box-sizing:border-box}
.viewport{position:relative;flex:1 1 auto;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.frame{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 10px 40px rgba(13,75,36,.18)}
.stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;background:var(--paper);display:none;overflow:hidden}
.slide.on{display:block}

/* nav */
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.nav button{font:600 14px var(--f-vi);color:var(--brand);background:var(--card);border:1px solid var(--sage-border);border-radius:999px;padding:8px 16px;cursor:pointer}
.nav button:hover{background:var(--subtle)}
.nav button:focus-visible,.say:focus-visible,.chip:focus-visible{outline:3px solid var(--emphasis);outline-offset:2px}
.nav button:disabled{opacity:.4;cursor:default}
.count{font:600 14px var(--f-en);color:var(--text-2);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}

.foot{position:absolute;left:120px;right:120px;bottom:52px;display:flex;align-items:center;justify-content:space-between;font:400 24px var(--f-vi);color:var(--text-3)}
.foot img{height:40px}
.foot .pg{font-family:var(--f-en);font-variant-numeric:tabular-nums}

/* sound slide */
.sound{position:absolute;left:120px;right:120px;top:210px;bottom:140px;display:grid;grid-template-columns:600px 1fr;gap:56px}
.sym-card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:48px 52px;display:flex;flex-direction:column;gap:26px}
.sym-big{font:600 220px/1 var(--f-ipa);color:var(--brand);letter-spacing:-.01em}
.sym-big.di{font-size:180px}
.glide{display:flex;align-items:center;gap:18px;font:600 48px var(--f-ipa);color:var(--text-2)}
.glide b{color:var(--brand);background:var(--subtle);border:1px solid var(--sage-border);border-radius:16px;padding:2px 18px;font-weight:600}
.tags{display:flex;gap:12px;flex-wrap:wrap}
.tag{font:700 24px var(--f-vi);color:var(--brand);background:var(--subtle);border:1px solid var(--sage-border);border-radius:999px;padding:6px 20px}
.tag.alt{color:var(--text-2);background:var(--card);border-color:var(--border)}
.tip-h{font:700 26px var(--f-vi);text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:0}
.tip{font:400 34px/1.45 var(--f-vi);color:var(--text);margin:0}
.words{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:28px;overflow:hidden}
.w{flex:1;display:grid;grid-template-columns:60px 1fr 1fr 96px;align-items:center;gap:24px;padding:0 44px;border-top:1px solid var(--grid)}
.w:first-child{border-top:0}
.w .n{font:700 30px var(--f-en);color:var(--text-3);font-variant-numeric:tabular-nums}
.w .en{font:700 64px var(--f-en);color:var(--text)}
.w .ipa{font:400 50px var(--f-ipa);color:var(--text-2)}
.w .ipa b{color:var(--brand);font-weight:700;background:var(--subtle);border-radius:8px;padding:0 4px}
.say{width:84px;height:84px;border-radius:50%;border:1px solid var(--sage-border);background:var(--subtle);color:var(--brand);cursor:pointer;display:grid;place-items:center}
.say:hover{background:var(--brand);color:#fff}
.say svg{width:38px;height:38px}
.say.big{width:auto;height:auto;border-radius:999px;padding:10px 26px;font:700 26px var(--f-vi);gap:10px;display:inline-flex;align-items:center;align-self:flex-start}
.say.big svg{width:30px;height:30px}

/* overview */
.ov{position:absolute;left:120px;right:120px;top:200px;bottom:130px;display:grid;grid-template-columns:1fr 1fr;gap:48px}
.ov-col{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:36px 44px;display:flex;flex-direction:column;gap:18px}
.ov-col h4{margin:0;font:700 40px var(--f-vi)}
.ov-col p{margin:0;font:400 28px/1.45 var(--f-vi);color:var(--text-2)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.chip{font:600 54px var(--f-ipa);color:var(--brand);background:var(--subtle);border:1px solid var(--sage-border);border-radius:20px;padding:10px 0;cursor:pointer;text-align:center}
.chip:hover{background:var(--brand);color:#fff}
.chip small{display:block;font:400 22px var(--f-en);color:inherit;opacity:.75;margin-top:4px}

/* closing */
.close-list{margin:40px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:22px;max-width:1450px}
.close-list li{font:400 36px/1.4 var(--f-vi);color:rgba(255,255,255,.88);padding-left:44px;position:relative}
.close-list li::before{content:"";position:absolute;left:0;top:16px;width:18px;height:18px;border:4px solid #fff;border-radius:50%;opacity:.8}

.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:#fff;font:400 14px var(--f-vi);padding:10px 16px;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.slide.on{animation:fade .25s ease}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

<div class="app">
  <div class="viewport" id="vp"><div class="frame" id="frame"><div class="stage" id="stage"></div></div></div>
  <div class="nav">
    <button id="prev" type="button" aria-label="Slide trước">← Trước</button>
    <span class="count" id="count">1 / 1</span>
    <button id="next" type="button" aria-label="Slide sau">Sau →</button>
    <button id="ovBtn" type="button">Tổng quan</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

  w:[["out","/[aʊ]t/"],["now","/n[aʊ]/"],["how","/h[aʊ]/"],["account","/əˈk[aʊ]nt/"],["download","/ˌd[aʊ]nˈləʊd/"]]}
];

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ipaHTML=s=>esc(s).replace(/\[(.+?)\]/g,"<b>$1</b>");
const slides=[]; const index={};
const foot=(label)=>`<div class="foot"><img src="${LOGO}" alt="cisbox"><span>${label}</span><span class="pg"></span></div>`;

slides.push(`<section class="slide dark"><img class="wm" src="${WM}" alt=""><img class="logo" src="${LOGO_W}" alt="cisbox">
 <div class="cover-body"><span class="kick">Chapter English · Pronunciation</span>
 <h1>Luyện phát âm nguyên âm tiếng Anh</h1>
 <p class="sub">Bước 1: 12 nguyên âm đơn · Bước 2: 8 nguyên âm đôi<br>Mỗi âm 5 từ quen thuộc trong công việc, có phiên âm IPA.</p></div></section>`);

const chips=(arr,start)=>arr.map((v,i)=>`<button class="chip" type="button" data-go="${start+i}">${v.s}<small>${v.w[0][0]}</small></button>`).join("");
const OV=slides.length;
const mStart=OV+2, dStart=mStart+MONO.length+1;
slides.push(`<section class="slide"><div class="head"><span class="pill">Tổng quan</span><h3>20 nguyên âm cần luyện</h3></div>
 <div class="ov">
  <div class="ov-col"><span class="pill" style="align-self:flex-start">Bước 1</span><h4>Nguyên âm đơn</h4><p>Giữ nguyên khẩu hình từ đầu đến cuối. Dấu ː nghĩa là âm dài.</p><div class="chips">${chips(MONO,mStart)}</div></div>
  <div class="ov-col"><span class="pill" style="align-self:flex-start">Bước 2</span><h4>Nguyên âm đôi</h4><p>Trượt từ âm thứ nhất sang âm thứ hai, âm đầu rõ hơn âm sau.</p><div class="chips">${chips(DI,dStart)}</div></div>
 </div>${foot("Chọn một âm để tới slide luyện tập")}</section>`);

const divider=(n,title,sub,arr)=>`<section class="slide dark"><img class="wm" src="${WM}" alt=""><img class="logo" src="${LOGO_W}" alt="cisbox"><div class="ghost">${n}</div>
 <div class="div-body"><span class="kick">Bước ${+n}</span><h2>${title}</h2><p class="sub">${sub}</p><div class="sym-row">${arr.map(v=>`<span>/${v.s}/</span>`).join("")}</div></div></section>`;

const wordsHTML=v=>v.w.map(([en,ipa],i)=>`<div class="w"><span class="n">${i+1}</span><span class="en">${en}</span><span class="ipa">${ipaHTML(ipa)}</span>
 <button class="say" type="button" data-say="${en}" aria-label="Nghe ${en}">${SPK}</button></div>`).join("");

slides.push(divider("01","Nguyên âm đơn","12 âm. Khẩu hình giữ nguyên trong suốt âm. Chú ý cặp ngắn – dài như /ɪ/ – /iː/.",MONO));
MONO.forEach((v,i)=>{index[v.s]=slides.length;slides.push(`<section class="slide"><div class="head"><span class="pill">Bước 1 · Nguyên âm đơn ${i+1}/${MONO.length}</span><h3>Âm /${v.s}/</h3></div>
 <div class="sound"><div class="sym-card"><div class="sym-big">/${v.s}/</div>
  <div class="tags"><span class="tag">${v.len}</span><span class="tag alt">Phân biệt với /${v.pair}/</span></div>
  <p class="tip-h">Cách đọc</p><p class="tip">${v.tip}</p>
  <button class="say big" type="button" data-say="${v.w.map(x=>x[0]).join(", ")}">${SPK}Nghe cả 5 từ</button></div>
 <div class="words">${wordsHTML(v)}</div></div>${foot("Bước 1 · Nguyên âm đơn")}</section>`)});

slides.push(divider("02","Nguyên âm đôi","8 âm. Mỗi âm là một cú trượt từ âm đầu sang âm sau, không tách thành hai tiếng.",DI));
DI.forEach((v,i)=>{index[v.s]=slides.length;slides.push(`<section class="slide"><div class="head"><span class="pill">Bước 2 · Nguyên âm đôi ${i+1}/${DI.length}</span><h3>Âm /${v.s}/</h3></div>
 <div class="sound"><div class="sym-card"><div class="sym-big di">/${v.s}/</div>
  <div class="glide"><b>${v.g[0]}</b><span>→</span><b>${v.g[1]}</b></div>
  <p class="tip-h">Cách đọc</p><p class="tip">${v.tip}</p>
  <button class="say big" type="button" data-say="${v.w.map(x=>x[0]).join(", ")}">${SPK}Nghe cả 5 từ</button></div>
 <div class="words">${wordsHTML(v)}</div></div>${foot("Bước 2 · Nguyên âm đôi")}</section>`)});

slides.push(`<section class="slide dark"><img class="wm" src="${WM}" alt=""><img class="logo" src="${LOGO_W}" alt="cisbox">
 <div class="cover-body"><span class="kick">Cách luyện mỗi ngày</span><h2>10 phút, đều đặn</h2>
 <ul class="close-list">
  <li>Mỗi ngày chọn 2–3 âm, đọc to 5 từ, mỗi từ 3 lần.</li>
  <li>Luyện theo cặp dễ nhầm: /ɪ/ – /iː/, /e/ – /æ/, /ʌ/ – /ɑː/, /ʊ/ – /uː/.</li>
  <li>Ghi âm giọng mình, nghe lại và so với bản đọc mẫu.</li>
  <li>Đặt từ vào câu công việc thật: “Can you review my code today?”</li>
 </ul></div></section>`);

const stage=document.getElementById("stage");
stage.innerHTML=slides.join("");
const els=[...stage.querySelectorAll(".slide")];
els.forEach((el,i)=>{const p=el.querySelector(".pg");if(p)p.textContent=`${i+1} / ${els.length}`});
let cur=0;
function show(i,push=true){cur=Math.max(0,Math.min(els.length-1,i));els.forEach((e,j)=>e.classList.toggle("on",j===cur));
 document.getElementById("count").textContent=`${cur+1} / ${els.length}`;
 document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===els.length-1;
 if(push){const h=cur?`#slide-${cur+1}`:"";if(location.hash!==h){try{history.replaceState(null,"",h||location.pathname+location.search)}catch(e){location.hash=h}}}}
function fromHash(){const m=/^#slide-(\d+)$/.exec(location.hash);show(m?+m[1]-1:0,false)}
document.getElementById("prev").onclick=()=>show(cur-1);
document.getElementById("next").onclick=()=>show(cur+1);
document.getElementById("ovBtn").onclick=()=>show(OV);
addEventListener("keydown",e=>{if(["ArrowRight","PageDown"," "].includes(e.key)&&e.target.tagName!=="BUTTON"||e.key==="ArrowRight"){e.preventDefault();show(cur+1)}
 else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(cur-1)}
 else if(e.key==="Home")show(0);else if(e.key==="End")show(els.length-1)});
addEventListener("hashchange",fromHash);
let tx=null;stage.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(cur+(d<0?1:-1));tx=null});

// scale
const vp=document.getElementById("vp"),frame=document.getElementById("frame");
function fit(){const s=Math.min(vp.clientWidth/1920,vp.clientHeight/1080);stage.style.transform=`scale(${s})`;frame.style.width=1920*s+"px";frame.style.height=1080*s+"px"}
new ResizeObserver(fit).observe(vp);fit();

// speech
const toast=document.getElementById("toast");let tt;
function note(t){toast.textContent=t;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2600)}
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang==="en-GB")||v.find(x=>/^en/.test(x.lang))||null}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
stage.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){show(+g.dataset.go);return}
 const b=e.target.closest("[data-say]");if(!b)return;
 if(!("speechSynthesis" in window)){note("Trình duyệt này không hỗ trợ đọc mẫu. Hãy tra từ trên Cambridge Dictionary.");return}
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.say);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)}
 catch(err){note("Không phát được âm thanh trên thiết bị này.")}});
fromHash();
</script>

</body></html>
